name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install osmium (pipeline tests shell out to it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

      # Pure-script perf tripwire for the overlay classify/gate/simplify
      # pipeline (scripts/render-checks/README.md has the full rendering-
      # changes-gate context). Deterministic, no browser, no network — the
      # Playwright render-check suite (`bun run render-check`) is a
      # separate local/manual command, not run in CI yet.
      - name: Overlay-paint perf budget
        run: bun scripts/bench-overlay-paint.ts
